<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calendário Criativo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --panel-bg: #1a1a1a;
      --accent: #E50914;
      --share-btn: #25D366;
      --text: #ffffff;
      --text-muted: #8c8c8c;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.2rem; }
    .badge {
      background: var(--accent);
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: capitalize;
      font-size: 0.8rem;
    }

    .grid-calendario {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .card-dia {
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid var(--border);
      min-height: 150px;
      cursor: pointer;
    }
    .card-dia:hover {
      border-color: #666;
    }
    .dia-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.85);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      z-index: 2;
    }
    .thumb-wrapper {
      width: 100%;
      height: 120px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .sem-arte {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-align: center;
    }

    /* Modal do Editor */
    #modalEditor {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.97);
      z-index: 1000;
      flex-direction: row;
    }

    /* Barra Lateral Esquerda */
    .sidebar {
      width: 320px;
      max-width: 90vw;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      gap: 14px;
      z-index: 1001;
    }

    .sidebar h2 {
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .sidebar .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-section label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .sidebar-section input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: #252525;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #ffffff;
      font-size: 0.88rem;
    }

    .sidebar-section input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #555;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .color-btn:hover {
      transform: scale(1.15);
      border-color: #fff;
    }

    .action-buttons {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    button.btn {
      padding: 10px;
      border-radius: 4px;
      border: none;
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    button.btn-accent { background: var(--accent); color: #fff; }
    button.btn-share { background: var(--share-btn); color: #fff; }
    button.btn-sec { background: #333; color: #ccc; }
    button.btn:hover { opacity: 0.9; }

    /* Área Central de Visualização / Canvas */
    .editor-body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      background: #0d0d0d;
      padding: 12px;
    }

    /* Responsivo para Celular: painel fica na base como gaveta */
    @media (max-width: 768px) {
      #modalEditor {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        max-width: 100%;
        max-height: 52vh;
        border-right: none;
        border-top: 1px solid var(--border);
      }
      .editor-body {
        flex: 1;
        max-height: 48vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="tituloMes">Calendário de Postagens</h1>
    <div id="badgeMes" class="badge">--</div>
  </header>

  <div id="grade" class="grid-calendario"></div>

  <!-- MODAL DO EDITOR COM BARRA LATERAL -->
  <div id="modalEditor">
    <!-- LATERAL ESQUERDA: TODAS AS CONFIGURAÇÕES -->
    <div class="sidebar">
      <h2>
        <span>Personalizar Arte</span>
        <button class="close-btn" onclick="fecharEditor()" title="Fechar">✕</button>
      </h2>

      <!-- Texto Superior -->
      <div class="sidebar-section">
        <label>Texto da Faixa Superior</label>
        <input type="text" id="inputTextoTopo" value="SEU TEXTO PRINCIPAL AQUI" oninput="atualizarTextoTopo(this.value)">
      </div>

      <!-- Telefone / WhatsApp -->
      <div class="sidebar-section">
        <label>Telefone / WhatsApp Inferior</label>
        <input type="text" id="inputTelefone" value="(81) 99437-0775" oninput="atualizarTelefone(this.value)">
      </div>

      <!-- Seletor de Cores da Faixa -->
      <div class="sidebar-section">
        <label>Cor das Faixas (Superior e Inferior)</label>
        <div class="color-row">
          <div class="color-btn" style="background: rgba(0,0,0,0.85);" title="Preto Sólido" onclick="alterarCorFaixas('rgba(0,0,0,0.88)')"></div>
          <div class="color-btn" style="background: #E50914;" title="Vermelho" onclick="alterarCorFaixas('#E50914')"></div>
          <div class="color-btn" style="background: #ffeb3b;" title="Amarelo" onclick="alterarCorFaixas('#ffeb3b')"></div>
          <div class="color-btn" style="background: #007bff;" title="Azul" onclick="alterarCorFaixas('#007bff')"></div>
          <div class="color-btn" style="background: #128C7E;" title="Verde Escuro" onclick="alterarCorFaixas('#128C7E')"></div>
          <div class="color-btn" style="background: #ffffff;" title="Branco" onclick="alterarCorFaixas('#ffffff')"></div>
        </div>
      </div>

      <!-- Seletor de Cores dos Textos -->
      <div class="sidebar-section">
        <label>Cor das Letras</label>
        <div class="color-row">
          <div class="color-btn" style="background: #ffffff;" title="Branco" onclick="alterarCorLetras('#ffffff')"></div>
          <div class="color-btn" style="background: #ffeb3b;" title="Amarelo" onclick="alterarCorLetras('#ffeb3b')"></div>
          <div class="color-btn" style="background: #25D366;" title="Verde" onclick="alterarCorLetras('#25D366')"></div>
          <div class="color-btn" style="background: #00e5ff;" title="Ciano" onclick="alterarCorLetras('#00e5ff')"></div>
          <div class="color-btn" style="background: #111111;" title="Preto" onclick="alterarCorLetras('#111111')"></div>
        </div>
      </div>

      <!-- Ações Finais -->
      <div class="action-buttons">
        <button class="btn btn-share" onclick="compartilharOuBaixar()">📲 Compartilhar Arte</button>
        <button class="btn btn-accent" onclick="baixarImagemFinal()">💾 Baixar no Celular / PC</button>
        <button class="btn btn-sec" onclick="fecharEditor()">Voltar ao Calendário</button>
      </div>
    </div>

    <!-- ÁREA DO CANVAS -->
    <div class="editor-body">
      <canvas id="canvasFabric"></canvas>
    </div>
  </div>

  <script>
    let canvas;
    let nomeArquivoAtual = 'arte-editada.png';
    let faixaTopoObj, faixaBaseObj, textoTopoObj, grupoWhatsAppObj, textoTelefoneObj;

    const svgWhatsApp = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
        <path fill="#25D366" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
      </svg>`;

    const hoje = new Date();
    const anoAtual = hoje.getFullYear();
    const mesAtual = hoje.getMonth() + 1;
    const mesFormatado = String(mesAtual).padStart(2, '0');
    const totalDias = new Date(anoAtual, mesAtual, 0).getDate();
    const nomeMes = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

    window.onload = function() {
      canvas = new fabric.Canvas('canvasFabric');
      document.getElementById('tituloMes').innerText = `Calendário - ${nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1)}`;
      document.getElementById('badgeMes').innerText = nomeMes;
      renderizarGrade();
    };

    function renderizarGrade() {
      const grade = document.getElementById('grade');
      grade.innerHTML = '';

      for (let dia = 1; dia <= totalDias; dia++) {
        const diaZero = String(dia).padStart(2, '0');
        const baseNome = `${anoAtual}-${mesFormatado}-${diaZero}`;
        const extensoes = ['.jpg.jpg', '.jpg', '.jpeg', '.png'];

        const card = document.createElement('div');
        card.className = 'card-dia';

        card.innerHTML = `
          <div class="dia-tag">Dia ${diaZero}</div>
          <div class="thumb-wrapper" id="thumb-${dia}">
            <img src="${baseNome}${extensoes[0]}" alt="Dia ${diaZero}">
          </div>
        `;

        const imgEl = card.querySelector('img');
        let indexExtensao = 0;

        imgEl.onerror = function() {
          indexExtensao++;
          if (indexExtensao < extensoes.length) {
            this.src = `${baseNome}${extensoes[indexExtensao]}`;
          } else {
            this.parentElement.innerHTML = '<span class="sem-arte">Sem arte</span>';
            card.onclick = null;
          }
        };

        imgEl.onload = function() {
          const caminhoFinal = this.src;
          card.onclick = () => carregarNoEditor(caminhoFinal);
        };

        grade.appendChild(card);
      }
    }

    function carregarNoEditor(urlImagem) {
      nomeArquivoAtual = urlImagem.substring(urlImagem.lastIndexOf('/') + 1);

      fabric.Image.fromURL(urlImagem, function(img) {
        if (!img || !img.width) return;

        document.getElementById('modalEditor').style.display = 'flex';

        const maxW = window.innerWidth > 768 ? (window.innerWidth - 360) : window.innerWidth * 0.94;
        const maxH = window.innerHeight > 768 ? (window.innerHeight * 0.88) : (window.innerHeight * 0.44);
        let escala = Math.min(maxW / img.width, maxH / img.height, 1);

        canvas.setWidth(img.width * escala);
        canvas.setHeight(img.height * escala);

        img.set({
          scaleX: escala,
          scaleY: escala,
          selectable: false,
          evented: false
        });

        canvas.clear();
        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));

        construirEstruturaPadrao();
      });
    }

    function construirEstruturaPadrao() {
      const alturaFaixa = Math.max(canvas.height * 0.11, 46);
      const corFaixaPadrao = 'rgba(0,0,0,0.85)';

      // 1. Faixa Superior
      faixaTopoObj = new fabric.Rect({
        left: 0,
        top: 0,
        width: canvas.width,
        height: alturaFaixa,
        fill: corFaixaPadrao,
        selectable: true,
        lockMovementX: true,
        lockMovementY: true
      });
      canvas.add(faixaTopoObj);

      // 2. Texto da Faixa Superior
      const textoTopoValor = document.getElementById('inputTextoTopo').value;
      textoTopoObj = new fabric.IText(textoTopoValor, {
        fontFamily: 'Impact, Arial Black, sans-serif',
        fontSize: Math.max(alturaFaixa * 0.46, 18),
        fill: '#ffffff',
        textAlign: 'center',
        shadow: 'rgba(0,0,0,0.8) 1px 1px 4px'
      });
      canvas.add(textoTopoObj);
      textoTopoObj.centerH();
      textoTopoObj.set({ top: (alturaFaixa - textoTopoObj.height) / 2 });

      // 3. Faixa Inferior
      faixaBaseObj = new fabric.Rect({
        left: 0,
        top: canvas.height - alturaFaixa,
        width: canvas.width,
        height: alturaFaixa,
        fill: corFaixaPadrao,
        selectable: true,
        lockMovementX: true,
        lockMovementY: true
      });
      canvas.add(faixaBaseObj);

      // 4. WhatsApp + Telefone
      const telefoneValor = document.getElementById('inputTelefone').value;
      fabric.loadSVGFromString(svgWhatsApp, function(objects, options) {
        const icone = fabric.util.groupSVGElements(objects, options);
        icone.scaleToWidth(alturaFaixa * 0.52);

        textoTelefoneObj = new fabric.IText(telefoneValor, {
          fontFamily: 'Arial, sans-serif',
          fontWeight: 'bold',
          fontSize: Math.max(alturaFaixa * 0.42, 17),
          fill: '#ffffff',
          left: icone.getScaledWidth() + 8,
          top: 1
        });

        grupoWhatsAppObj = new fabric.Group([icone, textoTelefoneObj], {
          shadow: 'rgba(0,0,0,0.6) 0px 2px 5px'
        });

        canvas.add(grupoWhatsAppObj);
        grupoWhatsAppObj.centerH();
        grupoWhatsAppObj.set({ top: (canvas.height - alturaFaixa) + (alturaFaixa - grupoWhatsAppObj.height) / 2 });
        canvas.renderAll();
      });
    }

    function atualizarTextoTopo(valor) {
      if (textoTopoObj) {
        textoTopoObj.set('text', valor);
        textoTopoObj.centerH();
        canvas.renderAll();
      }
    }

    function atualizarTelefone(valor) {
      if (textoTelefoneObj && grupoWhatsAppObj) {
        textoTelefoneObj.set('text', valor);
        grupoWhatsAppObj.addWithUpdate();
        grupoWhatsAppObj.centerH();
        canvas.renderAll();
      }
    }

    function alterarCorFaixas(cor) {
      if (faixaTopoObj) faixaTopoObj.set('fill', cor);
      if (faixaBaseObj) faixaBaseObj.set('fill', cor);
      canvas.renderAll();
    }

    function alterarCorLetras(cor) {
      if (textoTopoObj) textoTopoObj.set('fill', cor);
      if (textoTelefoneObj && grupoWhatsAppObj) {
        textoTelefoneObj.set('fill', cor);
        grupoWhatsAppObj.addWithUpdate();
      }
      canvas.renderAll();
    }

    function fecharEditor() {
      document.getElementById('modalEditor').style.display = 'none';
      canvas.clear();
    }

    function obterDataURL() {
      canvas.discardActiveObject();
      canvas.renderAll();
      return canvas.toDataURL({ format: 'png', quality: 1.0 });
    }

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--){ u8arr[n] = bstr.charCodeAt(n); }
      return new Blob([u8arr], {type: mime});
    }

    async function compartilharOuBaixar() {
      try {
        const dataURL = obterDataURL();
        const blob = dataURLtoBlob(dataURL);
        const nomeFinal = 'editado-' + nomeArquivoAtual;
        const file = new File([blob], nomeFinal, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Minha Arte'
          });
        } else {
          baixarImagemFinal();
        }
      } catch (err) {
        baixarImagemFinal();
      }
    }

    function baixarImagemFinal() {
      const dataURL = obterDataURL();
      const link = document.createElement('a');
      link.download = 'editado-' + nomeArquivoAtual;
      link.href = dataURL;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
