<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calendário Criativo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --accent: #E50914;
      --share-btn: #25D366;
      --text: #ffffff;
      --text-muted: #8c8c8c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2f2f2f;
    }
    header h1 { font-size: 1.2rem; }
    .badge {
      background: var(--accent);
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: capitalize;
      font-size: 0.8rem;
    }

    .grid-calendario {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .card-dia {
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid #2a2a2a;
      min-height: 150px;
      cursor: pointer;
    }
    .card-dia:hover {
      border-color: #666;
    }
    .dia-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.85);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      z-index: 2;
    }
    .thumb-wrapper {
      width: 100%;
      height: 120px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .sem-arte {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-align: center;
    }

    /* Modal do Editor */
    #modalEditor {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.96);
      z-index: 1000;
      flex-direction: column;
      padding: 10px;
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: #333;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    button:hover { background: #444; }
    button.btn-accent { background: var(--accent); border-color: var(--accent); }
    button.btn-share { background: #128C7E; border-color: #128C7E; }
    
    .color-palette {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #444;
    }
    .color-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid #555;
      cursor: pointer;
    }

    .editor-body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      background: #0a0a0a;
      border-radius: 6px;
      padding: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="tituloMes">Calendário de Postagens</h1>
    <div id="badgeMes" class="badge">--</div>
  </header>

  <div id="grade" class="grid-calendario"></div>

  <!-- MODAL DO EDITOR -->
  <div id="modalEditor">
    <div class="editor-header">
      <div class="toolbar">
        <button onclick="adicionarTextoTopo()">🔤 Texto Topo</button>
        <button onclick="adicionarWhatsAppEmbaixo()">📞 WhatsApp</button>
        
        <div class="color-palette">
          <div class="color-btn" style="background: #ffffff;" title="Branco" onclick="aplicarCor('#ffffff')"></div>
          <div class="color-btn" style="background: #ffeb3b;" title="Amarelo" onclick="aplicarCor('#ffeb3b')"></div>
          <div class="color-btn" style="background: #25D366;" title="Verde" onclick="aplicarCor('#25D366')"></div>
          <div class="color-btn" style="background: #00e5ff;" title="Ciano" onclick="aplicarCor('#00e5ff')"></div>
          <div class="color-btn" style="background: #ff1744;" title="Vermelho" onclick="aplicarCor('#ff1744')"></div>
        </div>

        <button onclick="removerSelecionado()" style="color: #ff6b6b;">🗑️ Excluir</button>
      </div>
      <div class="toolbar">
        <button class="btn-share" onclick="compartilharOuBaixar()">📲 Compartilhar</button>
        <button class="btn-accent" onclick="baixarImagemFinal()">💾 Baixar</button>
        <button onclick="fecharEditor()">✕ Sair</button>
      </div>
    </div>
    <div class="editor-body">
      <canvas id="canvasFabric"></canvas>
    </div>
  </div>

  <script>
    let canvas;
    let nomeArquivoAtual = 'arte-editada.png';

    const svgWhatsApp = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
        <path fill="#25D366" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
      </svg>`;

    const hoje = new Date();
    const anoAtual = hoje.getFullYear();
    const mesAtual = hoje.getMonth() + 1;
    const mesFormatado = String(mesAtual).padStart(2, '0');
    const totalDias = new Date(anoAtual, mesAtual, 0).getDate();
    const nomeMes = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

    window.onload = function() {
      canvas = new fabric.Canvas('canvasFabric');
      document.getElementById('tituloMes').innerText = `Calendário - ${nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1)}`;
      document.getElementById('badgeMes').innerText = nomeMes;
      renderizarGrade();
    };

    function renderizarGrade() {
      const grade = document.getElementById('grade');
      grade.innerHTML = '';

      for (let dia = 1; dia <= totalDias; dia++) {
        const diaZero = String(dia).padStart(2, '0');
        const nomeArquivo = `${anoAtual}-${mesFormatado}-${diaZero}.jpg`;

        const card = document.createElement('div');
        card.className = 'card-dia';

        card.innerHTML = `
          <div class="dia-tag">Dia ${diaZero}</div>
          <div class="thumb-wrapper">
            <img src="${nomeArquivo}" alt="Dia ${diaZero}" 
                 onerror="this.parentElement.innerHTML='<span class=\\'sem-arte\\'>Sem arte</span>'">
          </div>
        `;

        card.onclick = () => carregarNoEditor(nomeArquivo);
        grade.appendChild(card);
      }
    }

    function carregarNoEditor(nomeArquivo) {
      nomeArquivoAtual = nomeArquivo;

      fabric.Image.fromURL(nomeArquivo, function(img) {
        if (!img || !img.width) return;

        document.getElementById('modalEditor').style.display = 'flex';

        const maxW = window.innerWidth * 0.92;
        const maxH = window.innerHeight * 0.70;
        let escala = Math.min(maxW / img.width, maxH / img.height, 1);

        canvas.setWidth(img.width * escala);
        canvas.setHeight(img.height * escala);

        img.set({
          scaleX: escala,
          scaleY: escala,
          selectable: false,
          evented: false
        });

        canvas.clear();
        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
        canvas.renderAll();

        adicionarTextoTopo();
        adicionarWhatsAppEmbaixo();
      });
    }

    function fecharEditor() {
      document.getElementById('modalEditor').style.display = 'none';
      canvas.clear();
    }

    function adicionarTextoTopo() {
      const textoTopo = new fabric.IText('SEU TEXTO PRINCIPAL AQUI', {
        fontFamily: 'Impact, Arial Black, sans-serif',
        fontSize: 22,
        fill: '#ffffff',
        stroke: '#000000',
        strokeWidth: 1.5,
        textAlign: 'center',
        shadow: 'rgba(0,0,0,0.9) 2px 2px 5px'
      });

      canvas.add(textoTopo);
      textoTopo.centerH();
      textoTopo.set({ top: 18 });
      canvas.setActiveObject(textoTopo);
      canvas.renderAll();
    }

    function adicionarWhatsAppEmbaixo() {
      fabric.loadSVGFromString(svgWhatsApp, function(objects, options) {
        const icone = fabric.util.groupSVGElements(objects, options);
        icone.scaleToWidth(26);

        const telefone = new fabric.IText('(81) 99437-0775', {
          fontFamily: 'Arial, sans-serif',
          fontWeight: 'bold',
          fontSize: 18,
          fill: '#ffffff',
          stroke: '#000000',
          strokeWidth: 1,
          shadow: 'rgba(0,0,0,0.9) 2px 2px 5px',
          left: 34,
          top: 2
        });

        const grupoWhatsApp = new fabric.Group([icone, telefone], {
          shadow: 'rgba(0,0,0,0.6) 0px 3px 8px'
        });

        canvas.add(grupoWhatsApp);
        grupoWhatsApp.centerH();
        grupoWhatsApp.set({ top: canvas.height - 50 });
        canvas.setActiveObject(grupoWhatsApp);
        canvas.renderAll();
      });
    }

    function aplicarCor(corHex) {
      const obj = canvas.getActiveObject();
      if (!obj) {
        canvas.getObjects().forEach(item => {
          if (item.type === 'i-text' || item.type === 'text') item.set('fill', corHex);
          if (item.type === 'group') {
            item.getObjects().forEach(sub => {
              if (sub.type === 'i-text') sub.set('fill', corHex);
            });
          }
        });
      } else {
        if (obj.type === 'i-text' || obj.type === 'text') obj.set('fill', corHex);
        if (obj.type === 'group') {
          obj.getObjects().forEach(sub => {
            if (sub.type === 'i-text') sub.set('fill', corHex);
          });
        }
      }
      canvas.renderAll();
    }

    function removerSelecionado() {
      const ativo = canvas.getActiveObject();
      if (ativo) canvas.remove(ativo);
    }

    function obterDataURL() {
      canvas.discardActiveObject();
      canvas.renderAll();
      return canvas.toDataURL({ format: 'png', quality: 1.0 });
    }

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--){ u8arr[n] = bstr.charCodeAt(n); }
      return new Blob([u8arr], {type: mime});
    }

    async function compartilharOuBaixar() {
      try {
        const dataURL = obterDataURL();
        const blob = dataURLtoBlob(dataURL);
        const nomeFinal = 'editado-' + nomeArquivoAtual;
        const file = new File([blob], nomeFinal, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Minha Arte'
          });
        } else {
          baixarImagemFinal();
        }
      } catch (err) {
        baixarImagemFinal();
      }
    }

    function baixarImagemFinal() {
      const dataURL = obterDataURL();
      const link = document.createElement('a');
      link.download = 'editado-' + nomeArquivoAtual;
      link.href = dataURL;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
